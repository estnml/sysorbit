<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon on Apple's grid: the same artwork as sysorbit.svg, its
       tile 824 of 1024 points so it sits with other macOS icons. -->
  <g transform="translate(72.5333 72.5333) scale(3.433333)">
  <!-- Tile in systemd's dark, with a faint edge for dark panels -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#201A26"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Brackets around the whole note, as in systemd's [●◀] -->
  <g fill="none" stroke="#B9B3C4" stroke-width="10"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M58 52H40V204H58"/>
    <path d="M198 52H216V204H198"/>
  </g>

  <!-- Two beamed notes: systemd's circle and left-pointing triangle as
       heads on one line, centred on the tile -->
  <g fill="#30D475" transform="translate(128 128) scale(1.2) translate(-126 -128)">
    <!-- Stems and the beam joining them; the triangle's stem rises from its base -->
    <path d="M98 162V94L180 78V162H174V95.17L104 108.83V162Z"/>
    <!-- Circle head -->
    <circle cx="88" cy="162" r="16"/>
    <!-- Triangle head pointing left -->
    <path d="M180 145L150 162L180 179Z"/>
  </g>
  </g>
</svg>
