name: Idea or feature request
description: Something sysorbit could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation or task, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How sysorbit could help. Sketches and screenshots are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Other tools or workarounds you use for it.
